name: CI

on:
  push:
    branches:
      - version-16
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linters:
    name: Linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check Python syntax and JSON files
        run: |
          python -m compileall -q non_profit
          find non_profit -name "*.json" -print0 | xargs -0 -n1 python -m json.tool > /dev/null

      - name: Ruff
        run: |
          pip install ruff
          ruff check non_profit

  tests:
    name: Server tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest release this app supports
          - label: "Frappe/ERPNext v16.50.0"
            frappe_branch: v16.50.0
            erpnext_branch: v16.50.0
          # the latest version 16 release line
          - label: "Frappe/ERPNext version-16"
            frappe_branch: version-16
            erpnext_branch: version-16

    services:
      mysql:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.frappe_branch }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.frappe_branch }}-

      - name: Install
        run: bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          FRAPPE_BRANCH: ${{ matrix.frappe_branch }}
          ERPNEXT_BRANCH: ${{ matrix.erpnext_branch }}

      - name: Run Tests
        run: |
          cd ~/frappe-bench/
          set -o pipefail
          bench --site test_site run-tests --app non_profit 2>&1 | tee ~/test-output.txt
        env:
          TYPE: server

      - name: Report test failures as annotations
        if: failure()
        run: python ${GITHUB_WORKSPACE}/.github/helper/annotate_failures.py ~/test-output.txt ~/frappe-bench/bench_start.log
