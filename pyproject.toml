[project]
name = "membership"
authors = [
    { name = "Frappe Technologies Pvt Ltd", email = "developers@frappe.io" },
]
description = "Memberships, donations, volunteers and chapters for not-for-profit organisations (Frappe/ERPNext v16, Australian edition)"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = [
    # Frappe and ERPNext are installed by bench (`bench get-app`), not from PyPI.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.50.0,<17.0.0"
erpnext = ">=16.50.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = [
    "B017",  # assertRaises(Exception)
    "B904",  # raise inside except without from
    "E101",  # indentation contains mixed spaces and tabs
    "E402",  # module level import not at top of file
    "E501",  # line too long
    "E741",  # ambiguous variable name
    "F401",  # "unused" imports
    "W191",  # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.ruff.lint.isort.sections]
"frappe" = ["frappe"]
"erpnext" = ["erpnext"]
"membership" = ["membership"]
